<div id="valueArea"
    style="text-align: center;display:flex;align-items: center;justify-content: center;text-align: center;word-break: break-all;">
    <div id="itemValue" style="word-break: break-all;white-space: pre-wrap;">
    </div>

</div>

<div id="bottomBar">
    <button onclick="btnSettings()" class="bottomButtons" style="font-size: 32pt;"><img class="bottomButtonImage"
            src="/public/icons/cog.png" /></button>
    <div>%BOTTOM_TEXT%</div>
    <button onclick="btnFullscreen()" class="bottomButtons"><img class="bottomButtonImage"
            src="/public/icons/fullscreen.png" /></button>
</div>


<div id="serviceInfo">
    <div id="itemDateTime" style="text-align: center; color:#888888;font-size: 12pt;"></div>
    <div style="color:#888888;">
        <div style="font-size: 8pt; text-align: center;">
            <pre id="itemSignature"></pre>
        </div>
        <div style="font-size: 12pt; text-align: center;">
            <div id="itemAddress" style="text-align: center; font-size: 8pt;"></div>
            <div>Last Update Time</div>
            <div id="itemLastUpdateTime"></div>
        </div>
    </div>
    <div style="display:flex;align-items: center;justify-content: center;text-align: center;margin-top: 40px;">
        <div id="qrcode" style="border: 2px solid #888888;padding: 10px;"></div>
        <script type="text/javascript">
            var qrcode = new QRCode("qrcode", {
                text: window.location.href,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#888888",
                correctLevel: QRCode.CorrectLevel.H,
            });            
        </script>
    </div>
</div>
