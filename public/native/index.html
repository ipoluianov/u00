<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Item View</title>
    <link rel="stylesheet" href="/public/native/style.css">
    <script src="/public/native/script.js" defer></script>
</head>

<body style="background-color: black;">
    <div style="max-width: 800px; margin: 0 auto;">
        <div style="background-color: #222222; color: #EEEEEE;">
            <div id="itemDisplayName" style="text-align: center; color: #EEEEEE; font-size: 24pt;"></div>
        </div>

        <div style="background-color: #111;">
            <div id="itemDateTime" style="color: #888888; text-align: center;"></div>
            <div id="itemValue" style="color: #EEEEEE;text-align: center;min-height: 200px; display:flex;align-items: center;justify-content: center;text-align: center;"></div>
        </div>

        <div style="color: #222222; font-size: 8pt; text-align: center;">
            <pre id="itemSignature"></pre>
        </div>
        <div style="color: #222222; font-size: 12pt; text-align: center;">
            <div id="itemAddress" style="text-align: center; color: #888888;font-size: 8pt;"></div>
            <div>Last Update Time</div>
            <div id="itemLastUpdateTime"></div>
        </div>
    </div>
</body>

</html>
